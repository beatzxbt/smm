# BINANCE => 0
# BYBIT => 1
# OKX => 2
# HYPERLIQUID => 3
# PARADEX => 4
# EXTENDED => 5
# DYDX_V4 => 6
exchange: 1

# Capitalization will be handled automatically.
# Ending (USDT, USD, USDC) MUST be spelled out.
# Example: "BTCUSDT", "SOLUSDT", "pepeusdc", "Xmrusd"
symbol: "SOLUSDT"

# PLAIN => 0
# A&S => 1
# STINKY => 2
strategy: 0

parameters:
  common:
    total_orders: 3             # Consider your rate limits!
    max_usd_position: 100       # Value in $ (USD)

  plain:
    # Feature params
    trades_tick_imbalance_window: 100
    trades_time_imbalance_window: 60.0
    trades_tick_excitement_window: 100
    trades_time_excitement_window: 60.0
    orderbook_imbalance_window: 100

    # Quote generator params
    minimum_spread: 10          # Value in BPS (Basis Points)
    aggressiveness: 0.75        # Must be 0.0 <-> 1.0
    taker_skew_threshold: 0.5   # Strategy will take when abs(fair_skew) exceeds this
  
  stinky:
    minimum_spread: 50          # Value in BPS (Basis Points)
    maximum_spread: 250         # Value in BPS (Basis Points)