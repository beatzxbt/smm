[project]
name = "bybit-smm-workspace"
version = "2.0.0"
description = "Workspace for crypto trading framework and strategies"
requires-python = ">=3.13.9"
dependencies = [
    "framework",
    "smm",
    "cmm",
    "napalm",
    "glasses",
]

[tool.uv.workspace]
members = ["framework", "smm", "cmm", "napalm", "glasses"]

[tool.uv.sources]
framework = { workspace = true }
smm = { workspace = true }
cmm = { workspace = true }
napalm = { workspace = true }
glasses = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
    "uv",
]

[tool.ty.src]
include = ["framework", "smm", "cmm", "napalm", "glasses", "tests"]
